<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Music</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card-bg: #1a1a1a;
      --text: #f1f1f1;
      --subtext: #aaa;
      --border: rgba(255, 255, 255, 0.1);
      --red: #ff0000;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f9f9f9;
        --card-bg: #ffffff;
        --text: #0f0f0f;
        --subtext: #606060;
        --border: rgba(0, 0, 0, 0.1);
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      color: var(--red);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: var(--subtext);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="currentColor" width="64" height="64">
        <path d="M23.64 7c-.45-.34-4.93-3.79-11.64-3.79-6.72 0-11.2 3.45-11.65 3.79-.39.3-.46.86-.16 1.25l11.1 14.16c.39.5 1.13.5 1.52 0l10.99-14.02c.3-.39.23-.95-.16-1.25zM12 21.5l-9.5-12.15c2.61-1.63 6.36-2.6 9.5-2.6s6.89.97 9.5 2.6L12 21.5z"/>
        <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2.5" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Please check your internet connection. Any music already cached in your library is still available for playback.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
      Retry Connection
    </button>
  </div>

  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
